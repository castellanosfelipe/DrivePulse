name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build estrictamente offline
        shell: powershell
        run: .\build.ps1

      - name: Verificar paquete
        shell: powershell
        run: |
          $Required = @(
            '.\dist\DriveMapper\agent\agent.exe',
            '.\dist\DriveMapper\agent\verify_access.exe',
            '.\dist\DriveMapper\drivemap\drivemap.exe',
            '.\dist\DriveMapper\DrivePulse-Setup.ps1',
            '.\dist\DriveMapper\Instalar DrivePulse.cmd',
            '.\dist\DriveMapper\install.ps1',
            '.\dist\DriveMapper\uninstall.ps1'
          )
          foreach ($Path in $Required) {
            if (-not (Test-Path -LiteralPath $Path)) {
              throw "Falta artefacto: $Path"
            }
          }

      - name: Smoke test de instalacion, reparacion y desinstalacion
        shell: powershell
        run: |
          $Installer = (Resolve-Path '.\dist\DriveMapper\install.ps1').Path
          $Uninstaller = (Resolve-Path '.\dist\DriveMapper\uninstall.ps1').Path
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File $Installer -NonInteractive -StartupTimeoutSeconds 90
            if ($LASTEXITCODE -ne 0) {
              throw "La instalacion limpia fallo con codigo $LASTEXITCODE."
            }

            Stop-ScheduledTask -TaskName 'DriveMapper-System' `
              -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            $LegacyBrokenAclFiles = @(
              'C:\ProgramData\DriveMapper\data\.entropy',
              'C:\ProgramData\DriveMapper\data\agent-status.json',
              'C:\ProgramData\DriveMapper\logs\agent.log'
            )
            foreach ($Path in $LegacyBrokenAclFiles) {
              if (Test-Path -LiteralPath $Path) {
                & icacls.exe $Path '/inheritance:r' | Out-Null
                if ($LASTEXITCODE -ne 0) {
                  throw "No se pudo preparar la ACL heredada de prueba: $Path"
                }
              }
            }

            & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File $Installer -NonInteractive -StartupTimeoutSeconds 90
            if ($LASTEXITCODE -ne 0) {
              throw "La reinstalacion idempotente fallo con codigo $LASTEXITCODE."
            }

            $Status = & 'C:\Program Files\DriveMapper\drivemap\drivemap.exe' `
              status --json | ConvertFrom-Json
            if (-not $Status.agent_running) {
              throw "El agente instalado no reporto un heartbeat sano."
            }
          } finally {
            if (Test-Path -LiteralPath $Uninstaller) {
              & powershell.exe -NoProfile -ExecutionPolicy Bypass `
                -File $Uninstaller -Purge
              if ($LASTEXITCODE -ne 0) {
                throw "La desinstalacion de smoke test fallo."
              }
            }
          }

      - name: Preparar assets de instalacion
        id: package
        shell: powershell
        run: |
          $Version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            'manual-' + $env:GITHUB_RUN_NUMBER
          }
          $Archive = "DrivePulse-$Version-win64.zip"
          $Installer = "DrivePulse-$Version-install.ps1"
          $Checksum = "DrivePulse-$Version-win64.sha256"
          Compress-Archive -Path '.\dist\DriveMapper\*' -DestinationPath $Archive
          Copy-Item -LiteralPath '.\setup.ps1' -Destination $Installer -Force
          $InstallerText = [IO.File]::ReadAllText(
            (Resolve-Path $Installer),
            [Text.Encoding]::UTF8
          )
          [IO.File]::WriteAllText(
            (Resolve-Path $Installer),
            $InstallerText,
            (New-Object Text.UTF8Encoding($true))
          )
          $Hash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash
          "$Hash  $Archive" | Set-Content -LiteralPath $Checksum -Encoding Ascii
          & .\Build-Installer.ps1 -Version $Version
          $FriendlyInstaller = "dist\release\DrivePulse-$Version-Setup.exe"
          if (-not (Test-Path -LiteralPath $FriendlyInstaller -PathType Leaf)) {
            throw "No se creó el instalador gráfico de doble clic."
          }
          "archive=$Archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer=$Installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum=$Checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "friendly_installer=$FriendlyInstaller" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Smoke test del instalador publicado de un comando
        shell: powershell
        run: |
          $ReleaseInstaller = '${{ steps.package.outputs.installer }}'
          $Archive = '${{ steps.package.outputs.archive }}'
          $Uninstaller = (Resolve-Path '.\dist\DriveMapper\uninstall.ps1').Path
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File $ReleaseInstaller -PackagePath $Archive -NonInteractive
            if ($LASTEXITCODE -ne 0) {
              throw "El instalador publicado fallo con codigo $LASTEXITCODE."
            }
            $Status = & 'C:\Program Files\DriveMapper\drivemap\drivemap.exe' `
              status --json | ConvertFrom-Json
            if (-not $Status.agent_running) {
              throw "El agente del instalador publicado no quedo sano."
            }
          } finally {
            if (Test-Path -LiteralPath $Uninstaller) {
              & powershell.exe -NoProfile -ExecutionPolicy Bypass `
                -File $Uninstaller -Purge
            }
          }

      - uses: actions/upload-artifact@v4
        if: steps.package.outcome == 'success'
        with:
          name: DrivePulse-win64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.checksum }}
            ${{ steps.package.outputs.friendly_installer }}
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Notes = @"
          ## Instalacion

          1. Descargue ``DrivePulse-$env:GITHUB_REF_NAME-Setup.exe``.
          2. Cópielo a la máquina Windows y haga doble clic.
          3. Ingrese letra, ruta, contraseña y usuario para cada unidad.
          4. Pulse **Instalar y mapear**.

          El asistente crea unidades persistentes visibles en el Explorador y,
          si se deja marcada la opción, también las habilita para ABBYY.
          Las credenciales se cifran con Windows DPAPI.
          "@
          $Assets = @(
            '${{ steps.package.outputs.archive }}',
            '${{ steps.package.outputs.installer }}',
            '${{ steps.package.outputs.checksum }}',
            '${{ steps.package.outputs.friendly_installer }}'
          )
          $PreviousErrorPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          $ReleaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $PreviousErrorPreference
          if ($ReleaseExists) {
            gh release upload $env:GITHUB_REF_NAME @Assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @Assets `
              --title "DrivePulse $env:GITHUB_REF_NAME" `
              --notes $Notes
          }
