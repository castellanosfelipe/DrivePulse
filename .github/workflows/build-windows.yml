name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build estrictamente offline
        shell: powershell
        run: .\build.ps1

      - name: Verificar paquete
        shell: powershell
        run: |
          $Required = @(
            '.\dist\DriveMapper\agent\agent.exe',
            '.\dist\DriveMapper\drivemap\drivemap.exe',
            '.\dist\DriveMapper\install.ps1'
          )
          foreach ($Path in $Required) {
            if (-not (Test-Path -LiteralPath $Path)) {
              throw "Falta artefacto: $Path"
            }
          }

      - name: Preparar assets de instalación
        id: package
        shell: powershell
        run: |
          $Version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            'manual-' + $env:GITHUB_RUN_NUMBER
          }
          $Archive = "DrivePulse-$Version-win64.zip"
          $Installer = "DrivePulse-$Version-install.ps1"
          $Checksum = "DrivePulse-$Version-win64.sha256"
          Compress-Archive -Path '.\dist\DriveMapper\*' -DestinationPath $Archive
          Copy-Item -LiteralPath '.\dist\DriveMapper\install.ps1' `
            -Destination $Installer -Force
          $Hash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash
          "$Hash  $Archive" | Set-Content -LiteralPath $Checksum -Encoding Ascii
          "archive=$Archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer=$Installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum=$Checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DrivePulse-win64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Notes = @"
          ## Instalación

          1. Descargue ``${{ steps.package.outputs.archive }}``.
          2. Verifique su SHA-256 con ``${{ steps.package.outputs.checksum }}``.
          3. Copie el ZIP a la máquina Windows offline.
          4. Extraiga todo el contenido.
          5. Ejecute PowerShell como administrador.
          6. Ejecute ``powershell.exe -ExecutionPolicy Bypass -File .\install.ps1``.
          7. Configure las unidades con ``drivemap add``; la contraseña se solicita de forma oculta.

          El asset ``${{ steps.package.outputs.installer }}`` permite revisar o
          automatizar el instalador, pero debe ejecutarse junto a las carpetas
          ``agent`` y ``drivemap`` extraídas del ZIP.
          "@
          $Assets = @(
            '${{ steps.package.outputs.archive }}',
            '${{ steps.package.outputs.installer }}',
            '${{ steps.package.outputs.checksum }}'
          )
          $PreviousErrorPreference = $ErrorActionPreference
          $ErrorActionPreference = 'SilentlyContinue'
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          $ReleaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $PreviousErrorPreference
          if ($ReleaseExists) {
            gh release upload $env:GITHUB_REF_NAME @Assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @Assets `
              --title "DrivePulse $env:GITHUB_REF_NAME" `
              --notes $Notes
          }
